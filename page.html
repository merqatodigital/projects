 experiences','Business apps & dashboards','Automation & connected tools','Social content & publishing'].map((s,i)=>'<div class="service"><small>0'+(i+1)+'</small><span>'+s+'</span><span>↗</span></div>').join('')+'</div></section><section class="contact"><div><div class="eyebrow">Your next chapter</div><h2>Something in mind?<br>Let’s make it happen.</h2><p>Tell us what you’re building. We’ll help find a practical way forward.</p></div><a class="pill primary" href="mailto:growpalawan@gmail.com">Start a conversation ↗</a></section><footer class="footer"><span>© '+new Date().getFullYear()+' Palawan Collective</span><span>Independent by nature. Useful by design.</span></footer>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;portfolio()})}

)};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(projects.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const p=projects.find(p=>p.id===b.dataset.toggle);await saveProject({...p,featured:!p.featured})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const p=projects.find(p=>p.id===b.dataset.delete);if(!confirm('Delete “'+p.name+'”? Export a backup first if you need a copy.'))return;try{await api('/api/projects/'+p.id,{method:'DELETE'});projects=projects.filter(x=>x.id!==p.id);render();toast('Project deleted')}catch(e){toast(e.message)}})}
function openEditor(p){editing=p?.id||null;cover=p?.image||'';$('#projectform').reset();$('#editheading').textContent=p?'Edit project':'New project';for(const k of ['name','description','category','status','repo','url'])if(p)$('#projectform').elements[k].value=p[k]||'';$('#projectform').elements.featured.checked=p?.featured||false;$('#imagehint').textContent=cover?'Cover image attached. Upload another to replace it.':'PNG, JPG, WebP or GIF · up to 8 MB';$('#removeimage').classList.toggle('hidden',!cover);$('#editor').showModal()}
async function quickImport(e){e.preventDefault();const form=e.target,button=$('#quicksubmit'),message=$('#quickmessage');button.disabled=true;button.textContent='Reading project…';message.textContent='Reading GitHub and the live website. This can take a few seconds.';try{const body=Object.fromEntries(new FormData(form));const result=await api('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});projects=await api('/api/projects');query='';filter='All';render();toast(result.project.name+' added to your portfolio');$('#quickmessage').textContent=result.warnings.length?result.warnings.join(' '):'Imported successfully. View portfolio to see the project, or edit its details below.'}catch(err){message.textContent=err.message;button.disabled=false;button.textContent='Add to portfolio'}}
async function saveProject(p){try{const saved=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const i=projects.findIndex(x=>x.id===saved.id);if(i<0)projects.unshift(saved);else projects[i]=saved;render();return true}catch(e){toast(e.message);return false}}$('#projectform').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;$('#save').textContent='Saving…';try{const file=$('#imagefile').files[0];if(file){if(file.size>8*1024*1024)throw Error('Image must be under 8 MB');const upload=await api('/api/upload',{method:'POST',headers:{'Content-Type':file.type},body:file});cover=upload.url}const data=Object.fromEntries(new FormData(e.target));data.featured=e.target.elements.featured.checked;data.image=cover;if(editing)data.id=editing;if(await saveProject(data)){$('#editor').close();toast(data.featured?'Saved — visible in portfolio':'Saved to library — hidden from portfolio')}}catch(err){toast(err.message)}finally{$('#save').disabled=false;$('#save').textContent='Save project'}};$('#cancel').onclick=()=>$('#editor').close();$('#removeimage').onclick=()=>{cover='';$('#imagefile').value='';$('#imagehint').textContent='Cover removed. Save to apply.';$('#removeimage').classList.add('hidden')};$('#viewbutton').onclick=()=>{location.hash=view==='library'?'work':'library'};window.addEventListener('hashchange',()=>{view=location.hash==='#library'?'library':'portfolio';filter='All';query='';render();refreshProjects();const target=location.hash==='#services'?'#services':location.hash==='#work'?'#work':null;if(target)$(target)?.scrollIntoView?.();else window.scrollTo(0,0)});async function refreshProjects(notify=false){try{projects=await api('/api/projects');render();if(notify)toast('Projects refreshed')}catch(e){toast(e.message)}};$('#closeimport').onclick=()=>$('#importer').close();$('#importform').onsubmit=async e=>{e.preventDefault();repos=[];$('#importselected').classList.add('hidden');$('#reporesults').textContent='Finding repositories…';const submit=e.target.querySelector('button');submit.disabled=true;try{repos=await api('/api/github?user='+encodeURIComponent($('#githubuser').value));$('#reporesults').innerHTML=repos.length?repos.map((r,i)=>'<label class="repooption"><input type="checkbox" value="'+i+'" '+(projects.some(p=>p.repo.toLowerCase()===r.html_url.toLowerCase())?'disabled':'checked')+'><div><b>'+esc(r.full_name)+'</b><p>'+esc(r.reference_only?'Details unavailable — saves the repository link only.':r.description||'No description yet')+'</p></div></label>').join(''):'<p class="hint">No public repositories found.</p>';$('#importselected').classList.toggle('hidden',!repos.length)}catch(err){$('#reporesults').textContent=err.message}finally{submit.disabled=false}};$('#importselected').onclick=async()=>{const selected=[...$('#reporesults').querySelectorAll('input:checked:not(:disabled)')].map(x=>repos[Number(x.value)]);if(!selected.length){toast('Select at least one repo');return}$('#importselected').disabled=true;let count=0;for(const r of selected){if(await saveProject({name:r.name,description:r.description||'',repo:r.html_url,url:r.homepage||'',category:'Web app',status:r.archived?'Archived':'In progress',featured:false,image:''}))count++}$('#importselected').disabled=false;$('#importer').close();toast(count+' repos imported')};api('/api/projects').then(x=>{projects=x;render()}).catch(e=>{$('#app').innerHTML='<div class="empty">Could not load projects. Please refresh to try again.</div>';toast(e.message)});
</script></body></html>
